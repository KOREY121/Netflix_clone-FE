<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamVault — Movies</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    #sv-search-section {
      display: none;
      padding: 0 4vw 1rem;
      position: relative; z-index: 1;
    }

    .sv-filter-bar {
      position: relative; z-index: 1;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 4vw 1.5rem;
      flex-wrap: wrap;
    }

    .sv-sort-select {
      background: rgba(10,22,40,0.85);
      border: 1px solid rgba(59,130,246,0.22);
      border-radius: 8px;
      color: var(--white);
      font-family: 'Outfit', sans-serif;
      font-size: 0.82rem;
      padding: 0.5rem 0.9rem;
      outline: none;
      cursor: pointer;
      transition: border-color .2s;
    }
    .sv-sort-select:focus { border-color: var(--sap-300); }

    .sv-results-count {
      font-size: 0.78rem;
      color: var(--muted);
      margin-left: auto;
    }
  </style>
</head>
<body>

<header class="sv-nav" id="sv-nav"></header>

<!-- PAGE HEADER -->
<div class="sv-page-header">
  <h1>Movies</h1>
  <p>Every film in the vault — from pulse-pounding action to quiet, devastating drama.</p>
</div>

<!-- SEARCH -->
<div id="sv-search-section">
  <div class="sv-search-wrap">
    <span class="sv-search-icon">🔍</span>
    <input class="sv-search-input" placeholder="Search movies…" oninput="handleSearch(this.value)">
  </div>
</div>

<!-- GENRE PILLS -->
<div class="sv-genre-row" id="genreRow"></div>

<!-- FILTER BAR -->
<div class="sv-filter-bar">
  <select class="sv-sort-select" id="sortSelect" onchange="applySort()">
    <option value="default">Sort: Featured</option>
    <option value="rating">Sort: Highest Rated</option>
    <option value="year_new">Sort: Newest First</option>
    <option value="year_old">Sort: Oldest First</option>
    <option value="title">Sort: A → Z</option>
  </select>
  <span class="sv-results-count" id="resultsCount"></span>
</div>

<!-- NEW RELEASES (wide) -->
<section class="sv-section">
  <div class="sv-section-header">
    <h2>New <span>This Month</span></h2>
  </div>
  <div class="sv-row" id="newRow"></div>
</section>

<div class="glow-divider"></div>

<!-- ALL MOVIES GRID -->
<section>
  <div class="sv-section-header" style="padding:0 4vw;margin-bottom:1.2rem;position:relative;z-index:1;">
    <h2>All <span>Movies</span></h2>
  </div>
  <div class="sv-grid" id="moviesGrid"></div>
</section>

<footer class="sv-footer" id="sv-footer"></footer>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  renderNav('movies');
  renderFooter('../');

  let currentGenre = 'All';
  let currentSort  = 'default';
  let searchQuery  = '';

  // Genre pills
  document.getElementById('genreRow').innerHTML = SV.genres.map(g =>
    `<div class="sv-genre-pill ${g.name==='All'?'active':''}" data-genre="${g.name}"
      onclick="toggleGenre(this, setGenre)">${g.name}</div>`
  ).join('');

  // New releases (wide)
  populateRow('newRow', SV.movies.slice(0,5).map(buildWideCard).join(''));

  function getFiltered() {
    let list = [...SV.movies];
    if (currentGenre !== 'All') list = list.filter(m => m.genre === currentGenre);
    if (searchQuery) list = list.filter(m => m.title.toLowerCase().includes(searchQuery));
    switch(currentSort) {
      case 'rating':   list.sort((a,b) => b.rating - a.rating); break;
      case 'year_new': list.sort((a,b) => b.release_year - a.release_year); break;
      case 'year_old': list.sort((a,b) => a.release_year - b.release_year); break;
      case 'title':    list.sort((a,b) => a.title.localeCompare(b.title)); break;
    }
    return list;
  }

  function render() {
    const list = getFiltered();
    document.getElementById('moviesGrid').innerHTML = list.length
      ? list.map(buildPosterCard).join('')
      : `<div style="grid-column:1/-1;text-align:center;padding:4rem 0;color:var(--muted);">No movies found for this filter.</div>`;
    document.getElementById('resultsCount').textContent = `${list.length} title${list.length!==1?'s':''}`;
  }

  function setGenre(genre) { currentGenre = genre; render(); }
  function applySort() { currentSort = document.getElementById('sortSelect').value; render(); }
  function handleSearch(q) { searchQuery = q.toLowerCase(); render(); }

  render();
</script>
</body>
</html>
