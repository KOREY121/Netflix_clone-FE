<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamVault — My List</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    #sv-search-section { display:none; padding:0 4vw 1rem; position:relative; z-index:1; }

    .sv-tabs {
      position: relative; z-index: 1;
      display: flex; gap: 0;
      padding: 0 4vw 1.5rem;
      border-bottom: 1px solid rgba(59,130,246,0.1);
      margin-bottom: 2rem;
    }

    .sv-tab {
      padding: 0.65rem 1.8rem;
      font-size: 0.85rem; font-weight: 600;
      cursor: pointer; border: none; background: none;
      color: rgba(248,250,252,0.45);
      border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s;
      letter-spacing: 0.03em;
    }
    .sv-tab.active {
      color: var(--sap-200);
      border-bottom-color: var(--sap-300);
    }

    .sv-list-header {
      position: relative; z-index: 1;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 4vw 1.5rem;
    }

    .sv-list-header h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem; letter-spacing: 0.06em;
    }
    .sv-list-header h2 span { color: var(--sap-300); }

    .sv-list-count {
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* Download cards (TABLE: Download) */
    .sv-download-card {
      display: flex; align-items: center; gap: 1.2rem;
      padding: 1rem 1.2rem;
      border-radius: 10px;
      background: rgba(10,22,40,0.6);
      border: 1px solid rgba(59,130,246,0.1);
      margin-bottom: 8px;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .sv-download-card:hover {
      background: rgba(59,130,246,0.08);
      border-color: rgba(59,130,246,0.25);
    }

    .sv-dl-thumb {
      width: 80px; height: 48px;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }
    .sv-download-card:nth-child(odd)  .sv-dl-thumb { background: linear-gradient(135deg,#1a3a6b,#0a1628); }
    .sv-download-card:nth-child(even) .sv-dl-thumb { background: linear-gradient(135deg,#0f2044,#1e3a5f); }

    .sv-dl-info { flex: 1; }
    .sv-dl-title { font-size: 0.88rem; font-weight: 600; }
    .sv-dl-meta  { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    .sv-dl-size {
      font-size: 0.72rem; color: var(--sap-300);
      font-weight: 600;
    }

    .sv-dl-expiry {
      font-size: 0.68rem; color: var(--muted);
      margin-top: 2px;
    }

    .sv-dl-delete {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(248,250,252,0.05);
      border: 1px solid rgba(248,250,252,0.1);
      color: var(--muted);
      font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, color .2s;
    }
    .sv-dl-delete:hover { background: rgba(239,68,68,0.2); color: #f87171; }

    /* Review section (TABLE: Review) */
    .sv-review-card {
      padding: 1.2rem 1.4rem;
      border-radius: 10px;
      background: rgba(10,22,40,0.6);
      border: 1px solid rgba(59,130,246,0.1);
      margin-bottom: 10px;
    }

    .sv-review-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 0.6rem;
    }

    .sv-review-title { font-size: 0.9rem; font-weight: 600; }
    .sv-review-stars { color: var(--gold); font-size: 0.9rem; }
    .sv-review-date  { font-size: 0.7rem; color: var(--muted); }
    .sv-review-text  { font-size: 0.82rem; color: rgba(248,250,252,0.6); line-height: 1.55; }
  </style>
</head>
<body>

<header class="sv-nav" id="sv-nav"></header>

<div class="sv-page-header">
  <h1>My List</h1>
  <p>Your saved titles, downloads, and reviews — all in one place.</p>
</div>

<div id="sv-search-section">
  <div class="sv-search-wrap">
    <span class="sv-search-icon">🔍</span>
    <input class="sv-search-input" placeholder="Search your list…" oninput="filterCards(this.value)">
  </div>
</div>

<!-- TABS -->
<div class="sv-tabs">
  <button class="sv-tab active" onclick="showTab('watchlist', this)">Watchlist</button>
  <button class="sv-tab" onclick="showTab('downloads', this)">Downloads</button>
  <button class="sv-tab" onclick="showTab('reviews', this)">Reviews</button>
</div>

<!-- WATCHLIST TAB -->
<div id="tab-watchlist">
  <div class="sv-list-header">
    <h2>Saved <span>Titles</span></h2>
    <span class="sv-list-count" id="listCount"></span>
  </div>
  <div class="sv-grid" id="myListGrid"></div>
  <div id="emptyState" style="display:none;" class="sv-empty-state">
    <div class="icon">📋</div>
    <h3>Your list is empty</h3>
    <p>Browse movies and series and tap <strong>+ My List</strong> to save them here.</p>
  </div>
</div>

<!-- DOWNLOADS TAB -->
<div id="tab-downloads" style="display:none; position:relative; z-index:1; padding:0 4vw;">
  <div style="margin-bottom:1.5rem;">
    <div style="font-size:0.78rem;color:var(--muted);margin-bottom:1rem;">
      3 titles · 4.2 GB used · Downloads expire in 30 days
    </div>
    <div id="downloadsList"></div>
  </div>
</div>

<!-- REVIEWS TAB -->
<div id="tab-reviews" style="display:none; position:relative; z-index:1; padding:0 4vw;">
  <div id="reviewsList"></div>
</div>

<footer class="sv-footer" id="sv-footer"></footer>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  renderNav('mylist');
  renderFooter('../');

  // Sample downloads (TABLE: Download)
  const downloads = [
    { content_id: 1,  size: '2.1 GB', expires: 'Expires Apr 29' },
    { content_id: 11, size: '1.4 GB', expires: 'Expires May 2'  },
    { content_id: 4,  size: '0.7 GB', expires: 'Expires May 5'  },
  ];

  // Sample reviews (TABLE: Review / Rating)
  const reviews = [
    { content_id: 1,  rating: 5, text: 'Absolutely mind-blowing. The visual effects are a decade ahead of their time. Best sci-fi since Arrival.', date: 'Apr 18, 2025' },
    { content_id: 11, rating: 5, text: 'Bingeable from start to finish. Dark Meridian S2 outdoes its already stellar first season.', date: 'Apr 10, 2025' },
    { content_id: 4,  rating: 4, text: 'A quietly devastating film. The final act lingers with you for days.', date: 'Mar 28, 2025' },
  ];

  function renderWatchlist() {
    const items = SV.myList.map(id => SV.getById(id)).filter(Boolean);
    document.getElementById('listCount').textContent = `${items.length} title${items.length !== 1 ? 's' : ''}`;
    if (items.length) {
      document.getElementById('myListGrid').innerHTML = items.map(buildPosterCard).join('');
      document.getElementById('emptyState').style.display = 'none';
    } else {
      document.getElementById('myListGrid').innerHTML = '';
      document.getElementById('emptyState').style.display = 'block';
    }
  }

  function renderDownloads() {
    document.getElementById('downloadsList').innerHTML = downloads.map(d => {
      const content = SV.getById(d.content_id);
      if (!content) return '';
      return `
        <div class="sv-download-card" onclick="openModal(${content.content_id})">
          <div class="sv-dl-thumb">${content.icon}</div>
          <div class="sv-dl-info">
            <div class="sv-dl-title">${content.title}</div>
            <div class="sv-dl-meta">${content.release_year} · ${content.duration} · ${content.genre}</div>
          </div>
          <div style="text-align:right;">
            <div class="sv-dl-size">${d.size}</div>
            <div class="sv-dl-expiry">${d.expires}</div>
          </div>
          <button class="sv-dl-delete" onclick="event.stopPropagation()">🗑</button>
        </div>`;
    }).join('');
  }

  function renderReviews() {
    document.getElementById('reviewsList').innerHTML = reviews.map(r => {
      const content = SV.getById(r.content_id);
      if (!content) return '';
      const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
      return `
        <div class="sv-review-card">
          <div class="sv-review-header">
            <div>
              <div class="sv-review-title">${content.title}</div>
              <div class="sv-review-date">${r.date}</div>
            </div>
            <div class="sv-review-stars">${stars}</div>
          </div>
          <div class="sv-review-text">${r.text}</div>
        </div>`;
    }).join('');
  }

  function showTab(name, el) {
    ['watchlist', 'downloads', 'reviews'].forEach(t => {
      document.getElementById(`tab-${t}`).style.display = t === name ? '' : 'none';
    });
    document.querySelectorAll('.sv-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  }

  renderWatchlist();
  renderDownloads();
  renderReviews();
</script>
</body>
</html>
